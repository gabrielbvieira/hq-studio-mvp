<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>HQ Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23ffd43b' stroke='%231d1b17' stroke-width='3'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='900' font-size='12' fill='%231d1b17'%3EHQ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Abrir navegação" aria-expanded="false" aria-controls="sidebar">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <button class="brand" type="button" data-action="overview" aria-label="HQ Studio — ir para o projeto">
          <span class="logo" aria-hidden="true">HQ</span><span class="brand-name">Studio</span>
        </button>
      </div>
      <div class="provider-picker">
        <label for="provider">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
          <span class="provider-label">Gerar com</span>
        </label>
        <select id="provider"></select>
        <span class="gen-options" id="gen-options" hidden>
          <select id="model" aria-label="Modelo do agente" title="Modelo que lê o pedido e chama o gerador de imagem"></select>
          <select id="effort" aria-label="Esforço de raciocínio" title="Menos esforço gasta menos tokens; a imagem custa o mesmo"></select>
        </span>
        <span id="provider-note" class="provider-note"></span>
      </div>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
    <div class="scrim" id="scrim"></div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
